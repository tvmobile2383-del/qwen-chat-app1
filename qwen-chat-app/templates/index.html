<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Qwen Chat</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">Q</span><span>Qwen Chat</span></div>
      <button id="new-chat" class="new-chat">＋ New chat</button>
      <div class="sidebar-note">A private chat interface connected to your Qwen model.</div>
      <div class="sidebar-bottom">Model API · Kaggle</div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="mobile-brand">Qwen Chat</div>
        <div class="model-label"><span class="status-dot"></span> Qwen API</div>
      </header>

      <section id="conversation" class="conversation" aria-live="polite">
        <div id="welcome" class="welcome">
          <div class="welcome-icon">Q</div>
          <h1>How can I help you today?</h1>
          <p>Ask a question to start a conversation with Qwen.</p>
          <div class="suggestions">
            <button class="suggestion" data-prompt="Explain Python decorators with a simple example.">Explain a coding concept</button>
            <button class="suggestion" data-prompt="Help me debug this Python error. What information do you need?">Help debug code</button>
            <button class="suggestion" data-prompt="Help me design a small Python application step by step.">Plan an application</button>
          </div>
        </div>
        <div id="messages" class="messages"></div>
      </section>

      <div class="composer-wrap">
        <form id="chat-form" class="composer">
          <textarea id="prompt" rows="1" placeholder="Message Qwen..." aria-label="Message Qwen"></textarea>
          <button id="send" type="submit" aria-label="Send message">↑</button>
        </form>
        <div class="disclaimer">Qwen can make mistakes. Verify important information.</div>
      </div>
    </main>
  </div>
  <script src="/static/script.js"></script>
</body>
</html>
